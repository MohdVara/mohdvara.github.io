      - heading "Art and animation took repeated correction." [level=3] [ref=e159]
      - generic [ref=e160]:
        - paragraph [ref=e161]: Getting the character art right took several rounds of direction and visual review. I asked for changes to the player’s proportions and facial treatment, then had to preserve that approved likeness across different directions and walking poses. I preferred the original, unnormalised artwork; the generation notes record that preference alongside the extraction and registration requirements.
        - paragraph [ref=e162]: Walking exposed problems that a still image could hide. Equal-sized frame cells did not guarantee equal visible character sizes, and the earlier sequence mixed walking contacts with idle and blink poses. The correction work separated those states, used a uniform scale per character and tied animation to measured movement. A live check also caught gait resets between fixed-step physics updates. These were asset and runtime problems that needed different checks.
        - paragraph [ref=e163]: The art review still records subtle support-leg differences in some generated poses, including Maya’s front passing frames. Automated bounds, registration and sequence checks could verify parts of the asset contract; they could not establish convincing anatomical motion on their own. I needed to inspect the artwork and movement in the game, and the remaining pose limitations were kept explicit.
    - region [ref=e164]:
      - paragraph [ref=e165]: 04 / Making change manageable
      - heading "Give each layer a clear responsibility." [level=2] [ref=e166]
      - generic [ref=e167]:
        - paragraph [ref=e168]: The game uses TypeScript, React, Phaser 3 and Vite. Its simulation owns the world state and publishes snapshots. React subscribes to those snapshots for interface updates; Phaser handles spatial presentation and traversal. A bridge carries room, proximity and interaction signals between the office and the interface.
        - paragraph [ref=e169]: "This boundary lets the simulation run without rendering the office. It supports deterministic tests, automated traversal and save-restoration checks, while interface and artwork changes can be inspected separately. Shared state still needs care: the main simulation runtime coordinates many systems, and adding a module is not free of integration work."
      - figure "Responsibility diagram simplified from the runtime, UI subscriptions and game bridge. It shows engineering boundaries without disclosing narrative rules." [ref=e170]:
        - paragraph [ref=e171]: Diagram 03 / Runtime responsibilities
        - generic [ref=e172]:
          - generic [ref=e173]:
            - heading "React interface" [level=3] [ref=e174]
            - paragraph [ref=e175]: Menus, reading, feedback and player actions
          - generic [ref=e176]:
            - heading "Phaser office" [level=3] [ref=e177]
            - paragraph [ref=e178]: Rooms, movement and spatial interaction
          - paragraph [ref=e179]: Room and interaction signals pass through the GameBridge
          - generic [ref=e180]:
            - paragraph [ref=e181]: Actions in ↓ / State snapshots out ↑
            - heading "TypeScript simulation runtime" [level=3] [ref=e182]
            - paragraph [ref=e183]: State transitions · authored rules · seeded randomness · consequence records
          - generic [ref=e184]:
            - heading "Persistence" [level=3] [ref=e185]
            - paragraph [ref=e186]: Validated snapshots, migrations and local archives
          - generic [ref=e187]:
            - heading "Headless verification" [level=3] [ref=e188]
            - paragraph [ref=e189]: Tests, traversal and independent replay
      - generic [ref=e191]:
        - generic [ref=e192]:
          - heading "Extend content through explicit rules" [level=3] [ref=e193]
          - paragraph [ref=e194]: Authored registries, typed actions and state predicates give new content a defined integration point. The event Director filters and scores authored possibilities; it is not a runtime language model inventing the story.
          - paragraph [ref=e195]: Seeded randomness makes a recorded sequence reproducible under matching code and settings. That is useful for debugging; it does not make the whole possibility space exhaustively tested.
        - generic [ref=e196]:
          - heading "Keep optional work out of startup" [level=3] [ref=e197]
          - paragraph [ref=e198]: The game defers Phaser, optional panels and other modules. Bundle checks inspect the startup graph and enforce size budgets, including keeping the analytics SDK outside startup until optional consent.
          - paragraph [ref=e199]: These controls make growth measurable. They do not establish a universal frame-rate or mobile performance guarantee.
      - heading "Preserve progress while the system evolves" [level=3] [ref=e200]
      - paragraph [ref=e202]: Save loading validates the record and applies explicit incremental migrations. Supported historical saves receive conservative defaults; loading restores a snapshot without replaying gameplay. Original bytes are retained before browser conversion, and unsupported or unreadable records have recovery paths.
      - figure "Invalid or unsupported records are preserved for recovery. Browser origin, storage access and quota remain real constraints; local saves are not cloud sync." [ref=e203]:
