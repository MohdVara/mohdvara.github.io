    - region [ref=e51]:
      - paragraph [ref=e52]: 01 / The product problem
      - heading "A small office. A growing system." [level=2] [ref=e53]
      - generic [ref=e54]:
        - paragraph [ref=e55]: "No Two Mondays starts with a simple premise: one working day, three coworkers and a production outage. The challenge was to make decisions feel connected across technical work, conversations and the office around you. The setting could stay compact while the underlying system became richer."
        - paragraph [ref=e56]: I used Codex throughout development, directing features, playing the results, reporting what felt wrong and asking for focused revisions. My work included setting the product constraints, deciding which changes belonged in the game, and requiring evidence that new work preserved existing behaviour.
        - paragraph [ref=e57]: Here, scalability means being able to add and revise behaviour without losing consistency, save compatibility or a usable browser experience. This is a client-side game; the project does not demonstrate multiplayer concurrency or backend traffic scaling.
      - figure "Actual game capture, 10 October 2026. An earlier presentation snapshot of the office; later development continued to refine the interface and artwork." [ref=e58]:
        - link "Open the full-size No Two Mondays office screenshot" [ref=e59] [cursor=pointer]:
          - /url: /images/no-two-mondays/office.jpg
          - img "No Two Mondays office at the beginning of the day, with coworkers, desks, room doors and the game toolbar." [ref=e60]
    - region [ref=e62]:
      - paragraph [ref=e63]: 02 / Working with AI
      - heading "The prompt started the work. Human judgment steered it." [level=2] [ref=e64]
      - generic [ref=e65]:
        - paragraph [ref=e66]: "Codex accelerated implementation, but each change still needed a human decision about what belonged in the game and whether the result worked. I set the direction, played the results, identified what felt unclear or inconsistent, and turned those observations into focused revisions. Keeping a human in the loop meant shaping the work throughout development: framing the problem, inspecting the result and deciding what needed to change."
        - paragraph [ref=e67]: "Domain expertise made that feedback actionable. Software engineering knowledge helped me translate a feature request into requirements for state ownership, persistence, compatibility and regression checks. Interaction decisions needed a different lens: could a player understand a choice, notice its consequences and navigate the interface comfortably? The useful brief connected the intended experience to the constraints and evidence needed to evaluate it."
      - figure "Each review feeds the next brief. This is a synthesis of the recorded workflow, rather than a transcript of one session." [ref=e68]:
