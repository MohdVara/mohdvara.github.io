    - region [ref=e223]:
      - paragraph [ref=e224]: 05 / Verification at scale
      - heading "Eight hours of automated exploration." [level=2] [ref=e225]
      - generic [ref=e226]:
        - paragraph [ref=e227]: The latest reviewed completion campaign ran on 15 October 2026 against a recorded 0.3.0-rc.1 / monday-8 source snapshot. Its eight-hour execution budget produced 112,402 completed simulation runs with matching verified receipts and unique run identifiers. The integrity report passed.
        - paragraph [ref=e228]: The tool used witness-guided exploration through normal simulation actions, with recorded settings and source identity. Of the retained artifacts, 8,050 were independently replayed. A compact suite selected 44 replay witnesses covering 118 observed targets. Those targets mix endings, achievements and challenges; they are not 118 separate stories.
      - generic [ref=e229]:
        - generic [ref=e230]:
          - term [ref=e231]: 112,402
          - definition [ref=e232]: completed runs / verified receipts
        - generic [ref=e233]:
          - term [ref=e234]: 8,050
          - definition [ref=e235]: independently replayed artifacts
        - generic [ref=e236]:
          - term [ref=e237]: "44"
          - definition [ref=e238]: replay witnesses in the compact suite
      - paragraph [ref=e239]: The execution budget elapsed in about 8 hours; final reporting finished afterward. Counts are specific to this campaign and its recorded source snapshot.
      - table [ref=e241]:
        - caption [ref=e242]: Selected outcome checks, using the game’s public locked-file labels
        - rowgroup [ref=e243]:
          - row [ref=e244]:
            - columnheader "Locked title" [ref=e245]
            - columnheader "Campaign status" [ref=e246]
        - rowgroup [ref=e247]:
