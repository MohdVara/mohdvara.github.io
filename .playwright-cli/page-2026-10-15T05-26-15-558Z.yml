    - region [ref=f2e159]:
      - paragraph [ref=f2e160]: 04 / Making change manageable
      - heading "Give each layer a clear responsibility." [level=2] [ref=f2e161]
      - generic [ref=f2e162]:
        - paragraph [ref=f2e163]: The game uses TypeScript, React, Phaser 3 and Vite. Its simulation owns the world state and publishes snapshots. React subscribes to those snapshots for interface updates; Phaser handles spatial presentation and traversal. A bridge carries room, proximity and interaction signals between the office and the interface.
        - paragraph [ref=f2e164]: "This boundary lets the simulation run without rendering the office. It supports deterministic tests, automated traversal and save-restoration checks, while interface and artwork changes can be inspected separately. Shared state still needs care: the main simulation runtime coordinates many systems, and adding a module is not free of integration work."
      - figure "Responsibility diagram simplified from the runtime, UI subscriptions and game bridge. It shows engineering boundaries without disclosing narrative rules." [ref=f2e165]:
        - paragraph [ref=f2e166]: Diagram 03 / Runtime responsibilities
        - generic [ref=f2e167]:
          - generic [ref=f2e168]:
            - heading "React interface" [level=3] [ref=f2e169]
            - paragraph [ref=f2e170]: Menus, reading, feedback and player actions
          - generic [ref=f2e171]:
            - heading "Phaser office" [level=3] [ref=f2e172]
            - paragraph [ref=f2e173]: Rooms, movement and spatial interaction
          - paragraph [ref=f2e174]: Room and interaction signals pass through the GameBridge
          - generic [ref=f2e175]:
            - paragraph [ref=f2e176]: Actions in ↓ / State snapshots out ↑
            - heading "TypeScript simulation runtime" [level=3] [ref=f2e177]
            - paragraph [ref=f2e178]: State transitions · authored rules · seeded randomness · consequence records
          - generic [ref=f2e179]:
            - heading "Persistence" [level=3] [ref=f2e180]
            - paragraph [ref=f2e181]: Validated snapshots, migrations and local archives
          - generic [ref=f2e182]:
            - heading "Headless verification" [level=3] [ref=f2e183]
            - paragraph [ref=f2e184]: Tests, traversal and independent replay
      - generic [ref=f2e186]:
        - generic [ref=f2e187]:
          - heading "Extend content through explicit rules" [level=3] [ref=f2e188]
          - paragraph [ref=f2e189]: Authored registries, typed actions and state predicates give new content a defined integration point. The event Director filters and scores authored possibilities; it is not a runtime language model inventing the story.
          - paragraph [ref=f2e190]: Seeded randomness makes a recorded sequence reproducible under matching code and settings. That is useful for debugging; it does not make the whole possibility space exhaustively tested.
        - generic [ref=f2e191]:
          - heading "Keep optional work out of startup" [level=3] [ref=f2e192]
          - paragraph [ref=f2e193]: The game defers Phaser, optional panels and other modules. Bundle checks inspect the startup graph and enforce size budgets, including keeping the analytics SDK outside startup until optional consent.
          - paragraph [ref=f2e194]: These controls make growth measurable. They do not establish a universal frame-rate or mobile performance guarantee.
      - heading "Preserve progress while the system evolves" [level=3] [ref=f2e195]
      - paragraph [ref=f2e197]: Save loading validates the record and applies explicit incremental migrations. Supported historical saves receive conservative defaults; loading restores a snapshot without replaying gameplay. Original bytes are retained before browser conversion, and unsupported or unreadable records have recovery paths.
      - figure "Invalid or unsupported records are preserved for recovery. Browser origin, storage access and quota remain real constraints; local saves are not cloud sync." [ref=f2e198]:
