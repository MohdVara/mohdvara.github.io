    - region [ref=f2e51]:
      - paragraph [ref=f2e52]: 01 / The product problem
      - heading "A small office. A growing system." [level=2] [ref=f2e53]
      - generic [ref=f2e54]:
        - paragraph [ref=f2e55]: "No Two Mondays starts with a simple premise: one working day, three coworkers and a production outage. The challenge was to make decisions feel connected across technical work, conversations and the office around you. The setting could stay compact while the underlying system became richer."
        - paragraph [ref=f2e56]: I used Codex throughout development, directing features, playing the results, reporting what felt wrong and asking for focused revisions. My work included setting the product constraints, deciding which changes belonged in the game, and requiring evidence that new work preserved existing behaviour.
        - paragraph [ref=f2e57]: Here, scalability means being able to add and revise behaviour without losing consistency, save compatibility or a usable browser experience. This is a client-side game; the project does not demonstrate multiplayer concurrency or backend traffic scaling.
      - figure "Actual game capture, 10 October 2026. An earlier presentation snapshot of the office; later development continued to refine the interface and artwork." [ref=f2e58]:
        - link "Open the full-size No Two Mondays office screenshot" [ref=f2e59] [cursor=pointer]:
          - /url: /images/no-two-mondays/office.jpg
          - img "No Two Mondays office at the beginning of the day, with coworkers, desks, room doors and the game toolbar." [ref=f2e60]
    - region [ref=f2e62]:
      - paragraph [ref=f2e63]: 02 / Working with AI
      - heading "The prompt was the start of the loop." [level=2] [ref=f2e64]
      - generic [ref=f2e65]:
        - paragraph [ref=f2e66]: "The development record shows a mixture of short corrections, larger feature briefs, reviews and continuation requests. Those requests were the steering mechanism: describe an intended experience, inspect the implementation, try it in the game, and make the next instruction more specific."
        - paragraph [ref=f2e67]: The important shift was from requesting an isolated feature to specifying the contract around it. A new interaction also needed clear feedback, consistent state changes, appropriate input behaviour, persistence rules and checks for regressions. Repository instructions and implementation notes made those expectations available to later coding sessions.
      - figure "Each review feeds the next brief. This is a synthesis of the recorded workflow, rather than a transcript of one session." [ref=f2e68]:
