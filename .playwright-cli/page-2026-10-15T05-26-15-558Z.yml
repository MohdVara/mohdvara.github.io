    - region [ref=f2e95]:
      - paragraph [ref=f2e96]: 03 / The cost of iteration
      - heading "210 prompts did not mean 210 finished features." [level=2] [ref=f2e97]
      - generic [ref=f2e98]:
        - paragraph [ref=f2e99]: "The historical audit recovered 210 deduplicated human prompts across 20 interactive sessions. A union of its bug-fixing, refinement and refactoring tags contains 37 distinct prompts. The project feedback log separately records 21 feedback entries at the time of this review. These are different measures: a feedback entry may summarize several requests, and a prompt may address several concerns."
        - paragraph [ref=f2e100]: The tagging is automated and lexical. It describes the requests that were recovered, rather than proving how many code modifications were necessary or how much time each feature took. The audit is a partial historical record, not the total lifetime prompt count.
