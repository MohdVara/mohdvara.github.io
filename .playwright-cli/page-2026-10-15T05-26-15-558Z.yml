    - region [ref=f2e218]:
      - paragraph [ref=f2e219]: 05 / Verification at scale
      - heading "Eight hours of automated exploration." [level=2] [ref=f2e220]
      - generic [ref=f2e221]:
        - paragraph [ref=f2e222]: The latest reviewed completion campaign ran on 15 October 2026 against a recorded 0.3.0-rc.1 / monday-8 source snapshot. Its eight-hour execution budget produced 112,402 completed simulation runs with matching verified receipts and unique run identifiers. The integrity report passed.
        - paragraph [ref=f2e223]: The tool used witness-guided exploration through normal simulation actions, with recorded settings and source identity. Of the retained artifacts, 8,050 were independently replayed. A compact suite selected 44 replay witnesses covering 118 observed targets. Those targets mix endings, achievements and challenges; they are not 118 separate stories.
      - generic [ref=f2e224]:
        - generic [ref=f2e225]:
          - term [ref=f2e226]: 112,402
          - definition [ref=f2e227]: completed runs / verified receipts
        - generic [ref=f2e228]:
          - term [ref=f2e229]: 8,050
          - definition [ref=f2e230]: independently replayed artifacts
        - generic [ref=f2e231]:
          - term [ref=f2e232]: "44"
          - definition [ref=f2e233]: replay witnesses in the compact suite
      - paragraph [ref=f2e234]: The execution budget elapsed in about 8 hours; final reporting finished afterward. Counts are specific to this campaign and its recorded source snapshot.
      - table [ref=f2e236]:
        - caption [ref=f2e237]: Selected outcome checks, using the game’s public locked-file labels
        - rowgroup [ref=f2e238]:
          - row [ref=f2e239]:
            - columnheader "Locked title" [ref=f2e240]
            - columnheader "Campaign status" [ref=f2e241]
        - rowgroup [ref=f2e242]:
          - row [ref=f2e243]:
            - rowheader "Handling instructions" [ref=f2e244]
            - cell "Verification quota complete" [ref=f2e245]
          - row [ref=f2e246]:
            - rowheader "Personal effects" [ref=f2e247]
            - cell "Verification quota complete" [ref=f2e248]
          - row [ref=f2e249]:
            - rowheader "An inconvenient agenda" [ref=f2e250]
            - cell "Known witness, unverified in this campaign" [ref=f2e251]
      - generic [ref=f2e252]:
        - paragraph [ref=f2e253]: "The campaign ended at its duration budget with two target gaps: the unverified outcome above and its associated achievement. That is an unresolved verification gap, not proof that the outcome is impossible. A long run is useful precisely because it can expose a stubborn blind spot rather than manufacture an all-green coverage claim."
        - paragraph [ref=f2e254]: Headless traversal does not exercise room collision, visual layout, keyboard focus or whether a person enjoys the pacing. Those need browser checks and human playtests. The 15 October release notes separately record 733 automated tests and a 133-test save-compatibility gate for the prepared release candidate; these are historical release checks, not tests rerun by this case study.
    - region [ref=f2e255]:
      - paragraph [ref=f2e256]: 06 / What I learned
      - heading "The leverage came from better constraints." [level=2] [ref=f2e257]
      - generic [ref=f2e258]:
        - paragraph [ref=f2e259]: "AI made it practical to move quickly between a feature idea, implementation and a diagnostic tool. My responsibility was to decide what the game should become and make the result reviewable: specific feedback, durable contracts, reproducible evidence and a clear boundary between an implemented change and a validated experience."
        - paragraph [ref=f2e260]: The lasting engineering work was in the feedback loop around the generated code. Modular boundaries reduced the scope of changes. Compatibility rules protected earlier progress. Traversal made large batches of behaviour inspectable. Asset provenance helped separate approved artwork from exports that still needed correction.
        - paragraph [ref=f2e261]: "I would carry that workflow into another project: establish acceptance criteria early, preserve observations alongside decisions, and ask for evidence at the layer being changed. Prompt count is a record of the process. Maintainable behaviour is the outcome I am trying to achieve."
      - generic [ref=f2e262]:
        - heading "Try the Monday for yourself." [level=3] [ref=f2e263]
        - paragraph [ref=f2e264]: The game is available on itch.io. This case study covers development snapshots and does not assert that every reviewed change is in the currently hosted build.
